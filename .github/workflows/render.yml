name: render
# Parallel cloud render: N jobs each render a slice of frames, a last job stitches + muxes audio.
on:
  workflow_dispatch:
    inputs:
      comp: { description: "Composition id", default: "JoshuaBell" }
      frames: { description: "Total frames", default: "1499" }
      slices: { description: "Slices (<=20)", default: "20" }

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.m.outputs.idx }}
    steps:
      - id: m
        run: |
          n=${{ inputs.slices }}; echo "idx=$(seq -s, 0 $((n-1)) | sed 's/^/[/;s/$/]/')" >> $GITHUB_OUTPUT

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJson(needs.plan.outputs.idx) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: engine/package-lock.json }
      - name: system libs for headless Chrome
        run: sudo apt-get update -y && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || true
      - run: npm ci
        working-directory: engine
      - name: render slice
        working-directory: engine
        run: |
          N=${{ inputs.frames }}; S=${{ inputs.slices }}; i=${{ matrix.i }}
          per=$(( (N + S - 1) / S )); a=$(( i * per )); b=$(( a + per - 1 )); [ $b -gt $((N-1)) ] && b=$((N-1))
          mkdir -p ../out
          for try in 1 2 3; do
            npx remotion render "${{ inputs.comp }}" "../out/p$(printf %04d $a).mp4" --frames=$a-$b --gl=swangle --concurrency=4 --timeout=300000 --muted --log=error && break
          done
          test -s "../out/p$(printf %04d $a).mp4"
      - uses: actions/upload-artifact@v4
        with: { name: "part-${{ matrix.i }}", path: out/*.mp4, retention-days: 3 }

  stitch:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "part-*", path: parts, merge-multiple: true }
      - name: concat + mux
        run: |
          ls parts/*.mp4 | sort | sed "s|^|file '$PWD/|;s|$|'|" > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy video_only.mp4
          ffmpeg -y -i video_only.mp4 -i engine/public/mix.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest final.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames,duration -of default=nw=1 final.mp4
      - uses: actions/upload-artifact@v4
        with: { name: final-video, path: final.mp4, retention-days: 7 }
